services:
  postgres:
    image: postgres:16
    container_name: school-admission-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: school_admission_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SchoolDb_2026

    ports:
       - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: